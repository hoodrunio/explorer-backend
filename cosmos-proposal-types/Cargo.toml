[package]
name = "cosmos-proposal-types"
version = "0.1.0"
edition = "2021"
description = "A library for handling Cosmos proposal types"

[dependencies]
tonic = "0.9"
prost = "0.11"
prost-reflect = "0.11"
prost-types = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
walkdir = "2.3"
regex = "1.9"
protoc-rust = "2.28"
dotenv = "0.15"

[dev-dependencies]
tokio-test = "0.4"
pretty_assertions = "1.3"

[build-dependencies]
tonic-build = "0.9"
walkdir = "2.3"
prost-build = "0.11"
dotenv = "0.15"
